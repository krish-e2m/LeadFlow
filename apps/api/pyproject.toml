[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadflow-api"
version = "0.1.0"
description = "LeadFlow: Multi-Tenant Lead Intelligence, Scoring, and Outreach Orchestration Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LeadFlow Engineering Team", email = "engineering@leadflow.local" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "passlib[bcrypt]>=1.7.4",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
